name: dsoinabox Scan
description: Run dsoinabox Docker scanner against the checked-out repository and emit HTML/SARIF reports.

inputs:
  image:
    description: Docker image for dsoinabox.
    required: false
    default: appsecthings/dsoinabox:latest
  failure_threshold:
    description: Severity threshold that causes a non-zero exit code (none, low, medium, high, critical).
    required: false
    default: high
  targets:
    description: "Scanner targets passed to -t (for example: all, secrets,sast,sca,iac,sbom)."
    required: false
    default: all
  extra_args:
    description: Additional CLI arguments appended to the dsoinabox command (shell-split by bash; quote/escape values containing spaces).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run dsoinabox in Docker
      shell: bash
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_FAILURE_THRESHOLD: ${{ inputs.failure_threshold }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra_args }}
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/reports"

        extra_args=()
        if [ -n "${INPUT_EXTRA_ARGS}" ]; then
          while IFS= read -r -d '' arg; do
            extra_args+=("$arg")
          done < <(
            python3 -c 'import os, shlex, sys; [sys.stdout.buffer.write(arg.encode() + b"\0") for arg in shlex.split(os.environ["INPUT_EXTRA_ARGS"])]'
          )
        fi

        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/scan_target" \
          -v "${GITHUB_WORKSPACE}/reports:/reports" \
          "${INPUT_IMAGE}" \
          -t "${INPUT_TARGETS}" \
          -o sarif,html \
          --failure_threshold "${INPUT_FAILURE_THRESHOLD}" \
          "${extra_args[@]}"
