name: Build and publish release artifacts

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Determine package version
        id: package-version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          print(f"version={version}")
          PY

      - name: Determine release behavior
        id: release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          extract_version() {
            python -c 'import sys, tomllib; data = tomllib.loads(sys.stdin.read()); project = data.get("project", {}); print(project.get("version", ""))'
          }

          branch="${GITHUB_REF_NAME}"
          previous_version=""
          version_changed="false"
          publish_image="false"

          if [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "${EVENT_BEFORE}:pyproject.toml" 2>/dev/null; then
              previous_version="$(
                git show "${EVENT_BEFORE}:pyproject.toml" | extract_version
              )"
            fi
          fi

          if [[ -z "$previous_version" || "$previous_version" != "$CURRENT_VERSION" ]]; then
            version_changed="true"
          fi

          if [[ "$branch" == "dev" && "$version_changed" == "true" ]]; then
            publish_image="true"
          fi
          if [[ "$branch" == "main" && "$version_changed" == "true" ]]; then
            publish_release="true"
            publish_image="true"
          else
            publish_release="false"
          fi

          {
            echo "branch=${branch}"
            echo "previous_version=${previous_version}"
            echo "version_changed=${version_changed}"
            echo "publish_image=${publish_image}"
            echo "publish_release=${publish_release}"
          } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Set up QEMU (arm64 builds)
        if: steps.release.outputs.publish_image == 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        if: steps.release.outputs.publish_image == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker-tags
        if: steps.release.outputs.publish_image == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.release.outputs.publish_release }}
        run: |
          image="appsecthings/dsoinabox"
          branch="${GITHUB_REF_NAME}"
          short_sha="${GITHUB_SHA::12}"

          if [[ "$branch" == "dev" ]]; then
            tags=(
              "${image}:dev"
              "${image}:dev-${short_sha}"
            )
          else
            tags=(
              "${image}:main"
              "${image}:sha-${short_sha}"
            )
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            tags+=(
              "${image}:${PACKAGE_VERSION}"
              "${image}:latest"
            )
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and (optionally) push image
        if: steps.release.outputs.publish_image == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Publish to PyPI
        if: steps.release.outputs.publish_release == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
