name: Build and publish release artifacts

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Determine package version
        id: package-version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          print(f"version={version}")
          PY

      - name: Determine release behavior
        id: release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          branch="${GITHUB_REF_NAME}"
          previous_version=""
          version_changed="false"

          if [[ "$branch" == "main" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git cat-file -e "${EVENT_BEFORE}:pyproject.toml" 2>/dev/null; then
              previous_version="$(
                git show "${EVENT_BEFORE}:pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])'
              )"
            fi
          fi

          if [[ "$branch" == "main" ]]; then
            if [[ -z "$previous_version" || "$previous_version" != "$CURRENT_VERSION" ]]; then
              version_changed="true"
            fi
          fi

          if [[ "$branch" == "main" && "$version_changed" == "true" ]]; then
            publish_release="true"
          else
            publish_release="false"
          fi

          {
            echo "branch=${branch}"
            echo "previous_version=${previous_version}"
            echo "version_changed=${version_changed}"
            echo "publish_release=${publish_release}"
          } >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        run: python -m build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: docker-tags
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
          PUBLISH_RELEASE: ${{ steps.release.outputs.publish_release }}
        run: |
          image="appsecthings/dsoinabox"
          branch="${GITHUB_REF_NAME}"
          short_sha="${GITHUB_SHA::12}"

          if [[ "$branch" == "dev" ]]; then
            tags=(
              "${image}:dev"
              "${image}:dev-${short_sha}"
            )
          else
            tags=(
              "${image}:main"
              "${image}:sha-${short_sha}"
            )
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            tags+=(
              "${image}:${PACKAGE_VERSION}"
              "${image}:latest"
            )
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "${tags[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and (optionally) push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Publish to PyPI
        if: steps.release.outputs.publish_release == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
