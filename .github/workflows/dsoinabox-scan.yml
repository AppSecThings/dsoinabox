name: dsoinabox Scan

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run dsoinabox composite action
        uses: ./.github/actions/dsoinabox-scan
        with:
          failure_threshold: high

      - name: Find SARIF report
        id: find_sarif
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif_file="$(find reports -type f -name '*.sarif' -print -quit || true)"
          if [ -n "${sarif_file}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "sarif_file=${sarif_file}" >> "$GITHUB_OUTPUT"
            echo "Found SARIF file: ${sarif_file}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No SARIF file found under reports/"
          fi

      - name: Upload SARIF to GitHub Security
        if: always() && steps.find_sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ steps.find_sarif.outputs.sarif_file }}
          category: dsoinabox

      - name: Upload dsoinabox reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsoinabox-reports
          path: reports/**
