name: dsoinabox Scan

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dsoinabox composite action
        uses: ./.github/actions/dsoinabox-scan
        with:
          failure_threshold: high

      - name: Find SARIF report
        id: find_sarif
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif_file="$(find reports -type f -name '*.sarif' -print -quit || true)"
          if [ -n "${sarif_file}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "sarif_file=${sarif_file}" >> "$GITHUB_OUTPUT"
            echo "Found SARIF file: ${sarif_file}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No SARIF file found under reports/"
          fi

      - name: Upload SARIF to GitHub Security
        if: always() && steps.find_sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: ${{ steps.find_sarif.outputs.sarif_file }}
          category: dsoinabox

      - name: Upload dsoinabox reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsoinabox-reports
          path: reports/**
