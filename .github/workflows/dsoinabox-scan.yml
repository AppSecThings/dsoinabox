name: dsoinabox Scan

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Scan this repository with the image built from this very checkout, so the
      # action and the CLI are always the same version (a pulled tag lags behind).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image from checkout
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          load: true
          tags: dsoinabox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run dsoinabox composite action
        uses: ./.github/actions/dsoinabox-scan
        with:
          image: dsoinabox:ci
          failure_threshold: high

      - name: Locate SARIF report
        id: find_sarif
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # every run refreshes reports/latest/, so no directory search is needed
          sarif_file="reports/latest/dsoinabox.sarif"
          if [ -f "${sarif_file}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "sarif_file=${sarif_file}" >> "$GITHUB_OUTPUT"
            echo "Found SARIF file: ${sarif_file}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No SARIF file at ${sarif_file}"
          fi

      - name: Upload SARIF to GitHub Security
        if: always() && steps.find_sarif.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: ${{ steps.find_sarif.outputs.sarif_file }}
          category: dsoinabox

      - name: Upload dsoinabox reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsoinabox-reports
          path: reports/**
