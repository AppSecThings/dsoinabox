[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsoinabox"
version = "0.1.6"
description = "DSO in a Box"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.12.4",
    "jinja2>=3.1.6",
    "pathspec>=0.12.1",
    "ruamel.yaml>=0.18.6",
]

[project.scripts]
dsoinabox = "dsoinabox.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "freezegun",
    "hypothesis",
    "syrupy",
    "typing-extensions",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "jsonschema>=4.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
addopts = "-q"
strict_markers = true

[tool.coverage.run]
source = ["dsoinabox"]
branch = true
omit = ["dsoinabox/**/__main__.py"]

[tool.coverage.report]
fail_under = 85

[tool.setuptools.packages.find]
include = ["dsoinabox*"]
namespaces = false

[tool.setuptools.package-data]
dsoinabox = [
    "reporting/templates/html/*",
    "reporting/templates/jenkins_html/*",
    "reporting/templates/jenkins_html/assets/*",
    "waivers/*.yaml",
    "waivers/schema_files/*.json",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", "dist", "build"]

[tool.ruff.lint]
# correctness-focused: pyflakes, pycodestyle errors, bugbear, import order
select = ["E", "F", "B", "I"]
ignore = [
    "E501",  # line length handled by convention, not enforced
    "E701", "E702",  # one-line helpers in fingerprint modules
    "E741",  # single-letter names in hashing helpers
    "B008",  # function call in default arg (argparse patterns)
    "B904",  # raise ... from err inside except (existing code style)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "E731", "F841"]

[tool.mypy]
python_version = "3.12"
packages = ["dsoinabox"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = false
check_untyped_defs = false
